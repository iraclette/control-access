{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:520px;margin:0 auto;">
    <h2 style="margin:0 0 10px;">Admin login</h2>
    <p class="help" style="margin-top:0;">შეიყვანე პაროლი ბინების სანახავად</p>

    {% if error %}
      <div class="error" style="margin: 10px 0;">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin-ui/login" class="grid" autocomplete="on">
      <input type="text" name="username" value="admin" autocomplete="username" style="display:none" aria-hidden="true">
      <input class="input" type="password" name="password" placeholder="პაროლი" autocomplete="current-password" required>
      <button class="btn primary" type="submit">შესვლა</button>
    </form>
  </div>
{% endblock %}
