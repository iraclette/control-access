name: Website

# Checks for the website (apps/web) and its database schema (supabase/); the browser tests
# also start the access backend (backend/) for the developer console. Runs on pull
# requests and on the platform-v2 integration branch. Everything runs against a throwaway
# local Supabase inside the runner: no secrets, nothing touches production.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/**"
      - "backend/**"
      - ".github/workflows/web.yml"
  push:
    branches: [platform-v2]
    paths:
      - "apps/web/**"
      - "supabase/**"
      - "backend/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database-and-browser:
    name: Database security + browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Migrations + seed are applied on start. Only the services the site uses are started.
      - name: Start local Supabase
        working-directory: .
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - name: Database security tests (pgTAP)
        working-directory: .
        run: supabase test db

      # The local stack's well-known development keys, not real secrets.
      - name: Point the site at the local Supabase
        working-directory: .
        run: |
          supabase status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SECRET_KEY=$(get SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_DEMO=1"
          } >> "$GITHUB_ENV"

      # The access backend, for the developer console: its tables (Alembic) and fake data
      # shaped like the real building, then the API in the background.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Start the access backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PIN_SALT: ci-pin-salt
          ADMIN_TOKEN: ci-admin-token
          DEVICE_SECRET: local-device-secret
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed_local
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          echo "ACCESS_API_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/backend.log
          retention-days: 7
