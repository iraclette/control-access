name: Website

# Checks for the website (apps/web) and its database schema (supabase/). Runs on pull
# requests and on the platform-v2 integration branch. Everything runs against a throwaway
# local Supabase inside the runner: no secrets, nothing touches production.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/**"
      - ".github/workflows/web.yml"
  push:
    branches: [platform-v2]
    paths:
      - "apps/web/**"
      - "supabase/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database-and-browser:
    name: Database security + browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Migrations + seed are applied on start. Only the services the site uses are started.
      - name: Start local Supabase
        working-directory: .
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - name: Database security tests (pgTAP)
        working-directory: .
        run: supabase test db

      # The local stack's well-known development keys, not real secrets.
      - name: Point the site at the local Supabase
        working-directory: .
        run: |
          supabase status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SECRET_KEY=$(get SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_DEMO=1"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
