; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; plain `pio run` keeps building only the firmware; tests: `pio test -e native`
default_envs = door, elevator, enroller

[env]
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  https://github.com/monkeyboard/Wiegand-Protocol-Library-for-Arduino.git

[env:door]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp> -<enroller_main.cpp>
build_flags =
  -DDEVICE_TYPE_DOOR
  -DUNLOCK_MS=5000
  -D FW_VERSION='"1.0.12"'
monitor_speed = 115200

[env:elevator]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp> -<enroller_main.cpp>
build_flags =
  -DDEVICE_TYPE_ELEVATOR
  -DUNLOCK_MS=20000
  -D FW_VERSION='"1.0.13"'
monitor_speed = 115200

[env:enroller]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = +<enroller_main.cpp> -<main.cpp>
build_flags =
  -DDEVICE_TYPE_ENROLLER
  -D FW_VERSION='"1.0.0"'
monitor_speed = 115200

; Host-side unit tests for src/sync_parser.h (no ESP32 needed): pio test -e native
[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_src_filter = -<*>
build_flags =
  -std=gnu++17
  -I src
  -I test/native_shim
  -DARDUINOJSON_ENABLE_ARDUINO_STREAM=1
test_filter = test_sync_parser
